name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install core dependencies
        run: uv sync --dev

      - name: Run fixture-based test suite
        run: >-
          uv run pytest -q
          --ignore-glob="tests/test_cv_*.py"
          --ignore=tests/test_m2_baseline_measurement.py
          --ignore=tests/test_m2_gta_adapter.py
          -k "not hackathon"
