[project]
name = "flag-football-ep"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.3",
    "pandas>=2.2.2",
    "ipykernel>=6.29.5",
    "polars>=1.5.0",
    "numpy>=2.1.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.9.2",
    "scikit-learn>=1.5.1",
    "hyperopt>=0.2.7",
    # Floor raised from 2.1.1: scikit-learn 1.6+ removed the plain
    # `_estimator_type` class attribute `RegressorMixin`/`ClassifierMixin`
    # used to set (replaced by `__sklearn_tags__`); xgboost 2.1.1's sklearn
    # wrapper still read `_estimator_type` directly in `save_model()`, so
    # `mlflow.xgboost.log_model` raised `TypeError: _estimator_type
    # undefined`. The `cv` extras group's `umap-learn>=0.5.12` requires
    # `scikit-learn>=1.6` (unified single-resolution lock), so scikit-learn
    # cannot be capped back down without breaking the `cv` group — raise the
    # xgboost floor to a release with `__sklearn_tags__` support instead
    # (Phase 2.1 plan 01, Task 2 fix).
    "xgboost>=2.1.4",
    # Upper-bounded: newer setuptools releases drop `pkg_resources`, which
    # `hyperopt` (core dependency, model/hyperparams.py) still imports at
    # module load time. Without this bound, resolving the `cv` extras group's
    # `torch` pulls the unified lock's `setuptools` past that cutoff and
    # breaks the core (no-extras) install (Phase 2.1 plan 01, Task 1 fix).
    "setuptools>=73.0.1,<81",
    "pyarrow>=17.0.0",
    "typer>=0.27",
    "mlflow>=3.15",
    "scipy>=1.14.1",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
# Phase 2.2 dataset-versioning stack (D-18: DVC + the OTC OBS S3-compatible
# backend). Kept in its own group, separate from `cv`, so a `dvc pull`-only
# workflow (e.g. a labelling machine that never trains) does not drag in the
# multi-GB torch stack. Both packages Apache-2.0 (C-06); legitimacy verified
# against pypi.org/project/dvc and pypi.org/project/dvc-s3 by human checkpoint
# 2026-09-01 (02.2-04 Task 1) — dvc's source moved to github.com/treeverse/dvc
# after the November 2025 lakeFS acquisition, dvc-s3 still at
# github.com/iterative/dvc-s3.
versioning = [
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
]

# Phase 2.1 CV tracking pilot stack (D-07: core install stays lean, opt in via
# `uv sync --extra cv`). Apache-2.0/MIT only (C-06). The AGPL-3.0-licensed
# tracking package named in the original source plan docs must never be added
# here — see docs/cv-setup.md and tests/test_cv_dependencies.py for the reason;
# `trackers` (roboflow, Apache-2.0) is the OC-SORT implementation this phase
# uses instead.
cv = [
    # `[train]` (not bare `rfdetr`): `RFDETRSmall.train()`/`.evaluate()` run on a
    # PyTorch Lightning stack (`rfdetr.training`) that ships behind this extras
    # group -- `pytorch-lightning`, `torchmetrics[detection]`, `faster-coco-eval`,
    # `pycocotools`, `roboflow`, `rf100vl` -- absent from a bare `pip install
    # rfdetr` (confirmed via `importlib.metadata.metadata("rfdetr").get_all(
    # "Requires-Dist")` against the installed 1.9.3; `cv/detect.py::train_detector`
    # raises `ImportError` pointing at this exact extra otherwise). All six
    # transitive packages independently verified Apache-2.0/BSD/MIT via PyPI +
    # GitHub license metadata (plan 02.1-10) -- C-06 stays satisfied.
    "rfdetr[train]>=1.9.3",
    "trackers>=2.6.0",
    "supervision>=0.30.0",
    "sahi>=0.12.6",
    "transformers>=5.15.1",
    "umap-learn>=0.5.12",
    "opencv-python>=5.0.0",
    "torch>=2.13",
    "cvat-sdk>=2.73.0",
]
# `autodistill`/`autodistill-grounding-dino` (RESEARCH's original zero-shot
# pre-labeling orchestration pick) are deliberately absent: `autodistill`
# 0.1.29's `autodistill.detection.detection_base_model` imports `roboflow` at
# module level, but `roboflow` is not declared in autodistill's own PyPI
# metadata — installing the `cv` group alone leaves `CaptionOntology`
# unimportable (`ModuleNotFoundError: No module named 'roboflow'`), confirmed
# on the primary machine 2026-08-24 (plan 02.1-01 Task 3 install probe,
# RESEARCH Open Question 2). Per this plan's documented fallback, zero-shot
# pre-labeling uses `transformers.GroundingDinoForObjectDetection` with the
# `IDEA-Research/grounding-dino-tiny` checkpoint instead (binding for plan
# 02.1-07) — already covered by the `transformers` entry above, no extra
# package needed. See docs/cv-setup.md.

[project.scripts]
ffep = "flag_football_ep.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flag_football_ep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
