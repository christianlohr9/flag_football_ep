# Checked-in configuration for the flag-football-ep pipeline.
#
# Paths and settings live here; secrets (API keys) are never written to this
# file — they resolve at runtime from the environment or a git-ignored .env
# (see .env.example and src/flag_football_ep/config.py:secret()).

[paths]
data_root = "data"
raw_hudl = "data/raw/hudl"
raw_sportapp = "data/raw/sportapp"
raw_ifaf = "data/raw/ifaf"
raw_legacy = "data/raw/legacy"
raw_hc_files = "data/raw/hc_files"
processed = "data/processed"
reference = "data/reference"
models = "models"
mlruns = "mlruns"
contract = "docs/data-contract.schema.json"
reports = "reports"
video = "data/video"
labels = "data/labels"
tracking = "data/processed/tracking"

[reference]
half_boundaries = "data/reference/half_boundaries.csv"
final_scores = "data/reference/final_scores.csv"
team_mapping = "data/reference/team_mapping.csv"
sportapp_games = "data/reference/sportapp_games.csv"
competition_tier = "data/reference/competition_tier.csv"
player_mapping = "data/reference/player_mapping.csv"
group_opponents = "data/reference/group_opponents.csv"
hover_positions = "data/reference/hover_positions.csv"
homography_calibration = "data/reference/homography_calibration.csv"
gt_positions = "data/reference/gt_positions.csv"
continuity_review = "data/reference/continuity_review.csv"
hc_games = "data/reference/hc_games.csv"
hc_splits = "data/reference/hc_splits.csv"

[sources.sportapp]
base_url = "https://main-api-1.sportapp.fi/api/v1/public"
api_key_env = "SPORTAPP_API_KEY"

[sources.ifaf]
base_url = "https://us.cpx.studio/v1"
tournament = "ffwc26-women"
api_key_env = "CPX_API_KEY"

[train]
# Exclusion origin: models/ep_model.ipynb cell 3 filtered `game_id != 37`,
# models/wp_model.ipynb cell 3 filtered `game_id != 35`. Canonical string
# game ids for the legacy data_raw.csv corpus are `legacy-<game_id>`.
ep_experiment = "ep_model"
wp_experiment = "wp_model"
exclude_games_ep = ["legacy-37"]
exclude_games_wp = ["legacy-35"]

# cycle_start_season is the documented "current cycle" boundary (Phase 1.4
# CONTEXT.md left this to implementer discretion): seasons >= this value are
# the current cycle in own-team player tables. own_team is the canonical
# team code the own-team efficiency report is built for.
[report]
own_team = "GER"
cycle_start_season = 2025

# Phase 2.1 CV tracking pilot settings. `resolution`/`sahi` are provisional
# defaults revised by the Phase 2.1 sighting review (plan 02.1-03); `resolution`
# must stay a multiple of 224 (= lcm(32, 56), valid under either documented
# RF-DETR divisibility rule). `train_batch_size = 4` / `train_grad_accum = 4` is
# the documented 8 GB-VRAM setting for the Dell box (D-05). `cvat_host` stays a
# loopback URL — the self-hosted CVAT instance must never bind a routable
# interface, because the footage it serves is PII (docs/capture-legal.md).
[cv]
pilot_session_id = "2026-05-16_FRIENDLY-GER-vs-PANAMA-ROJO-DRONE"
detector_model = "cv_detector_model"
detector_experiment = "cv_detector"
resolution = 896
sahi = false
sahi_slice = 640
sahi_overlap = 0.2
train_epochs = 30
train_batch_size = 4
train_grad_accum = 4
device = "cpu"
label_frame_target = 400
cvat_host = "http://localhost:8080"
cvat_username_env = "CVAT_USERNAME"
cvat_password_env = "CVAT_PASSWORD"
field_length_yards = 50.0
field_width_yards = 25.0
endzone_yards = 10.0

# Dataset versioning (D-18, Phase 2.2 plan 04). `dvc_remote_url` carries a
# PLACEHOLDER bucket name -- plan 02.2-14 provisions the real OTC OBS bucket,
# plan 02.2-20 replaces this value once it exists. Credentials are never
# stored here or in .dvc/config -- only the env-var *names* to resolve via
# secret(), same pattern as cvat_username_env/cvat_password_env above.
dvc_remote_name = "otc-obs"
dvc_remote_url = "s3://ffep-datasets-PLACEHOLDER/flag-football-datasets"
dvc_remote_endpoint = "https://obs.eu-de.otc.t-systems.com"
otc_obs_access_key_env = "OTC_OBS_ACCESS_KEY_ID"
otc_obs_secret_key_env = "OTC_OBS_SECRET_ACCESS_KEY"
